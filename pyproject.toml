[project]
name = "unifi-network-mcp"
version = "0.1.0"
description = "MCP server for UniFi Network (site/device/client inventory, device statistics, device restart) via Ubiquiti's official local Network Integration API"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.9.0,<2",
    "httpx>=0.27.0",
    "pydantic-settings>=2.3.0",
    "uvicorn>=0.30.0",
    "starlette>=0.41.0",
]

[project.scripts]
unifi-network-mcp = "unifi_network_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unifi_network_mcp"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
